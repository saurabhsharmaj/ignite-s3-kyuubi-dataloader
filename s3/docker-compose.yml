
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: local-s3
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweed-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

volumes:
  seaweed-data:
